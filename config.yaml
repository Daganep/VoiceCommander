# Voice Commander Configuration

# Language settings
language: ru

# Voice engine
voice_engine: sapi

# OCR engine
ocr_engine: tesseract

# Confirmation prompts
confirmations: true

# Push-to-talk key combination
push_to_talk_key: "Ctrl+Alt+V"

# Wake-word support (basic implementation)
wake_word_enabled: false
wake_word: "компьютер"

# Logging settings
log_level: INFO
log_file: logs/voice_commander.log